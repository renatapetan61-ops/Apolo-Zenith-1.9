# Apolo Zenith 1.9 — prototype TINY configuration
# Purpose: fast, CPU-runnable validation of the full training pipeline.
# This is a PROTOTYPE size — it is NOT the 199B model.
model:
  name: "Apolo Zenith 1.9 (prototype tiny)"
  # no 199B target here: this config builds what it really builds
  backbone:
    vocab_size: 324          # 4 specials + 256 bytes + 64 BPE merges
    hidden_size: 64
    num_layers: 2
    num_heads: 4
    head_dim: 16
    intermediate_size: 128
    max_seq_len: 64
    dropout: 0.0
    moe:
      num_experts: 4
      top_k: 2
      aux_loss_weight: 0.01
      capacity_factor: null
  vae:
    in_channels: 3
    latent_channels: 8
    base_channels: 16
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    scaling_factor: 0.18215
  video:
    latent_channels: 8
    num_frames: 4
    latent_size: 8
    hidden_size: 128
    num_layers: 2
    num_heads: 4
    patch_size: 2

training:
  batch_size: 16
  seq_len: 32
  steps: 150
  lr: 3.0e-3
  weight_decay: 0.1
  warmup_steps: 10
  grad_clip_norm: 1.0
  seed: 1337
  log_every: 10
  eval_every: 50
  checkpoint_dir: "checkpoints/tiny"
  data_path: "data/sample_corpus/corpus.txt"
